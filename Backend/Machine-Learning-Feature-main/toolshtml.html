<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tracker - Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .video-container {
            position: relative; width: 100%; background: #000;
            border: 2px solid #333; min-height: 300px;
        }
        #videoInput { display: none; }
        #imageOutput { width: 100%; height: auto; display: block; }
        .form-check-input:checked { background-color: #198754; border-color: #198754; }
    </style>
</head>
<body>

<div class="container-fluid p-4">
    <h2 class="text-center mb-4">🎛️ AI Tracker Pro Control</h2>

    <div class="row">
        <div class="col-md-12 mb-3">
            <div class="card">
                <div class="card-header bg-secondary text-white">⚙️ Active Detection Settings</div>
                <div class="card-body d-flex gap-4 flex-wrap justify-content-center">
                    
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="checkEmotion" checked onchange="updateConfig()">
                        <label class="form-check-label" for="checkEmotion">🎭 Deteksi Emosi</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="checkHead" checked onchange="updateConfig()">
                        <label class="form-check-label" for="checkHead">🧢 Deteksi Kepala (YOLO)</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="checkClothing" checked onchange="updateConfig()">
                        <label class="form-check-label" for="checkClothing">👕 Deteksi Baju (YOLO)</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="checkDB" checked onchange="updateConfig()">
                        <label class="form-check-label text-warning" for="checkDB">💾 Simpan ke Database</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="checkCSV" onchange="updateConfig()">
                        <label class="form-check-label text-info" for="checkCSV">📂 Simpan Log CSV & Foto</label>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">

                    <div>Status: <span id="connStatus" class="badge bg-danger">Disconnected</span></div>

                    <div class="d-flex align-items-center" style="gap:8px;">

                        <select class="form-select form-select-sm" id="cameraType" style="width:150px;">
                            <option value="webcam" selected>Webcam</option>
                            <option value="rtsp">RTSP Stream</option>
                        </select>

                        <select class="form-select form-select-sm" id="cameraSelect" style="width:220px;"></select>

                        <button id="startBtn" class="btn btn-success btn-sm">Start</button>
                    </div>

                </div>

                <div class="card-body p-0">
                    <div class="video-container">
                        <video id="videoInput" autoplay playsinline></video>
                        <canvas id="canvasHidden" style="display:none;"></canvas>
                        <img id="imageOutput" src="https://via.placeholder.com/800x600?text=Press+Start" alt="Stream">

                        <div id="rtspBox" class="p-3" style="display:none;">
                            <input id="rtspUrl" class="form-control form-control-sm" placeholder="rtsp://user:pass@ip:port/stream" />
                            <button class="btn btn-warning btn-sm mt-2 w-100" onclick="startRTSP()">
                                ▶ Start RTSP Stream
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header">Live Data</div>
                <div class="card-body p-0" style="overflow-y: auto; max-height: 500px;">
                    <table class="table table-dark table-striped mb-0">
                        <thead><tr><th>ID</th><th>Data</th></tr></thead>
                        <tbody id="tableData"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>


<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
<script>

    const SERVER_URL = 'http://10.120.1.217:5001';
    const socket = io(SERVER_URL);

    const videoInput = document.getElementById('videoInput');
    const imageOutput = document.getElementById('imageOutput');
    const canvasHidden = document.getElementById('canvasHidden');
    const ctx = canvasHidden.getContext('2d');

    const cameraType = document.getElementById('cameraType');
    const cameraSelect = document.getElementById('cameraSelect');
    const startBtn = document.getElementById('startBtn');

    let isStreaming = false;
    let isProcessing = false;

    // ===============================
    // UPDATE CONFIG KE SERVER (DITAMBAHKAN save_csv)
    // ===============================
    function updateConfig() {
        socket.emit('update_config', {
            emotion: document.getElementById('checkEmotion').checked,
            head: document.getElementById('checkHead').checked,
            clothing: document.getElementById('checkClothing').checked,
            db_save: document.getElementById('checkDB').checked,
            save_csv: document.getElementById('checkCSV').checked  // <--- TAMBAHAN
        });
    }

    // ===============================
    // HANDLE CAMERA TYPE CHANGE
    // ===============================
    cameraType.addEventListener('change', () => {
        const type = cameraType.value;

        if (type === "webcam") {
            document.getElementById('rtspBox').style.display = "none";
            cameraSelect.style.display = "block";
            startBtn.style.display = "block";
        } else {
            document.getElementById('rtspBox').style.display = "block";
            cameraSelect.style.display = "none";
            startBtn.style.display = "none";
            stopWebcam(); // matikan webcam
        }
    });


    // ===============================
    // LIST KAMERA WEBCAM
    // ===============================
    async function getCameras() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            cameraSelect.innerHTML = "";

            devices.filter(d => d.kind === 'videoinput').forEach((d) => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `Camera ${cameraSelect.length + 1}`;
                cameraSelect.appendChild(opt);
            });
        } catch (e) { console.log(e); }
    }

    window.addEventListener('load', getCameras);



    // ===============================
    // SOCKET CONNECT STATUS
    // ===============================
    socket.on('connect', () => {
        document.getElementById('connStatus').innerText = "Connected";
        document.getElementById('connStatus').className = "badge bg-success";
        updateConfig();
    });


    // ===============================
    // KIRIM FRAME WEBCAM
    // ===============================
    function sendFrame() {
        if (!isStreaming || isProcessing || !videoInput.videoWidth) return;

        isProcessing = true;

        canvasHidden.width = videoInput.videoWidth;
        canvasHidden.height = videoInput.videoHeight;

        ctx.drawImage(videoInput, 0, 0);
        const dataURL = canvasHidden.toDataURL('image/jpeg', 0.4);

        socket.emit('inference_image', { image: dataURL });
    }


    // ===============================
    // TERIMA HASIL TRACKING
    // ===============================
    socket.on('result_data', (data) => {
        imageOutput.src = data.image;

        const tbody = document.getElementById('tableData');
        tbody.innerHTML = "";

        data.people.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td><span class="badge bg-secondary">P${p.id}</span></td>
                    <td>
                        <small>
                            🎭: ${p.emotion}<br>
                            🧢: ${p.head}<br>
                            👕: ${p.clothes}
                        </small>
                    </td>
                </tr>
            `;
        });

        isProcessing = false;

        if (isStreaming) requestAnimationFrame(sendFrame);
    });


    // ===============================
    // START WEBCAM STREAMING
    // ===============================
    startBtn.addEventListener('click', async () => {
        const deviceId = cameraSelect.value;
        stopWebcam();

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: deviceId ? { exact: deviceId } : undefined }
            });

            videoInput.srcObject = stream;

            videoInput.onloadedmetadata = () => {
                isStreaming = true;
                isProcessing = false;
                sendFrame();
            };

        } catch (err) {
            alert("Error membuka webcam: " + err.message);
        }
    });


    function stopWebcam() {
        if (videoInput.srcObject) {
            videoInput.srcObject.getTracks().forEach(t => t.stop());
        }
        isStreaming = false;
    }


    // ===============================
    // START RTSP STREAM
    // ===============================
    function startRTSP() {
        const url = document.getElementById('rtspUrl').value.trim();
        if (!url) return alert("Masukkan RTSP URL!");

        stopWebcam(); // pastikan webcam mati

        socket.emit("start_rtsp", { url: url });
    }


</script>

</body>
</html>
